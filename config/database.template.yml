default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV['DB_HOST'] || 'localhost' %>
  username: <%= ENV['DB_USERNAME'] || 'postgres' %>
  password: <%= ENV['DB_PASSWORD'] || 'postgres' %>
  pool: <%= ENV["DB_POOL"] || ENV['RAILS_MAX_THREADS'] || 5 %>

development:
  <<: *default
  database: <%= ENV['DB_NAME'] || 'iqvoc_autoclassify_development' %>

test:
  <<: *default
  database: <%= ENV['DB_NAME'] || 'iqvoc_autoclassify_test' %>

production:
  <<: *default
  database: <%= ENV['DB_NAME'] || 'iqvoc_autoclassify_production' %>
