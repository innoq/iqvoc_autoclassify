<% socket = [
  "/tmp/mysql.sock",
  "/opt/local/var/run/mysql5/mysqld.sock",
  "/tmp/mysqld.sock",
  "/var/run/mysqld.sock"
].detect { |socket| File.exist?(socket) } %>

defaults: &defaults
  encoding: utf8
  username: root
  password:
<% if defined?(JRuby) %>
  adapter: jdbcmysql
  hostname: localhost
<% else %>
  adapter: mysql2
  socket: <%= socket %>
<% end %>

development:
  <<: *defaults
  database: iqvoc_autoclassify_development

# Warning: The database defined as 'test' will be erased and
# re-generated from your development database when you run 'rake'.
# Do not set this db to the same as development or production.
test:
  <<: *defaults
  database: iqvoc_autoclassify_test

production:
  encoding: utf8
  username: iqvoc_autoclassify
  password:
  database: iqvoc_autoclassify
  adapter: oracle_enhanced
